<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Pendientes, gastos fijos, ingresos y cuadre por periodo."
    />
    <link rel="icon" href="assets/img/noventia-logo.png" type="image/png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="assets/css/styles.css?v=20261002-noventia-v6"
    />
    <title>Iniciar sesión · Noventia</title>
  </head>
  <body>
    <main class="login-page">
      <section class="login-access">
        <div class="login-card">
          <a class="brand has-logo" href="pendientes.html">
            <span class="logo-window uses-original">
              <img
                class="brand-logo"
                data-brand-logo
                src="assets/img/noventia-logo.png"
                alt="Noventia" />
            </span>
            <span class="brand-wordmark" data-brand-name>Noventia</span>
          </a>
          <span class="eyebrow">ACCESO AL SISTEMA</span>
          <h2>Bienvenido a <span data-brand-name>Noventia</span></h2>
          <p>Ingresa con tu correo y contraseña.</p>
          <div
            id="login-error"
            class="alert alert-danger"
            role="alert"
            hidden
          ></div>
          <form id="login-form">
            <div class="form-field">
              <label class="form-label" for="login-email">Correo</label
              ><input
                class="form-control"
                id="login-email"
                name="email"
                type="email"
                required
                autocomplete="username"
                maxlength="254"
                placeholder="nombre@empresa.com"
              />
            </div>
            <div class="form-field">
              <label class="form-label" for="login-password">Contraseña</label>
              <div class="password-control">
                <input
                  class="form-control"
                  type="password"
                  name="password"
                  id="login-password"
                  required
                  autocomplete="current-password"
                /><button
                  type="button"
                  class="btn icon-button"
                  id="toggle-password"
                  aria-label="Mostrar contraseña"
                  aria-pressed="false"
                >
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <button class="btn btn-primary w-100" type="submit">
              Iniciar sesión
            </button>
          </form>
          <div class="role-explainer">
            <div>
              <i class="bi bi-shield-check"></i><strong>Administrador</strong
              ><span>Gestiona datos y usuarios.</span>
            </div>
            <div>
              <i class="bi bi-eye"></i><strong>Consulta</strong
              ><span>Revisa y exporta.</span>
            </div>
          </div>
          <p class="login-note">
            Tu administrador asigna los permisos de tu cuenta.
          </p>
        </div>
        <small class="login-foot">Noventia · Pendientes y gastos · MXN</small>
      </section>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script
      type="module"
      src="assets/js/login.js?v=20261002-noventia-v6"
    ></script>
  </body>
</html>
